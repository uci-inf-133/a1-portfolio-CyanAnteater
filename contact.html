<!doctype html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8">
    <meta name="author" content="Rina Taing">
    <meta name="description" content="Contact page">
    <meta name="viewport" content="width=device-width, initial-scale=1">

   <!-- you would link to an external stylesheet here! -->
    <link href="./style.css" rel="stylesheet">
   <!-- you would also link to Bootstrap here! -->
   <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
   <!--Google's font import-->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  
   <!--the TAB TITLE is edited via the TITLE tag-->
   <title>Contact</title>
</head>
  <!--all things visible on the page MUST be contained within the BODY tag -->
    <body class="bg-gradient-custom d-flex flex-column min-vh-100">
    <nav class="navbar navbar-expand-lg">
        <div class="container-fluid">
        <a id="brand" class="navbar-brand" href="/">
            <img id="tiny-logo" src="code-symbol.png" alt="Google Icons' HTML logo clipart"
            style="width: 30px; height: 30px;">
            A1 Project
        </a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNavAltMarkup"
            aria-controls="navbarNavAltMarkup" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNavAltMarkup">
            <div class="navbar-nav">
            <a class="nav-link" aria-current="page" href="./index.html" title="home page of website">Home</a>
            <a class="nav-link" aria-current="page" href="./portfolio.html" title="portfolio page of website">Portfolio</a>
            <a class="nav-link active" aria-current="page" href="./contact.html" title="contact page of website">Contact</a>
            </div>
        </div>
        </div>
    </nav>
    <!--contact form that uses default browser validation checks-->
    <!--needed to use <main> to be able to create the sticky footer so the page is responsive to tall screens-->
        <main class="flex-grow-1 d-flex align-items-center">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-11 col-md-8 col-lg-6">
                    <div class="card rounded-4">
                        <div class="card-body">
                            <h1 id="form-header" class="card-title mb-4">Contact Me</h1>
                            <img id="mail-icon" src="./mail.png" alt="Google Icons' mail logo clipart mail icon">
                            
                            <form class="needs-validation">
                                <div class="mb-3">
                                    <label for="email-input" class="form-label">Email address</label>
                                    <input class="form-control" type="email" id="email-input" placeholder="address@example.com" required>
                                </div>

                                <div class="mb-3">
                                    <label for="message-input" class="form-label">Message</label>
                                    <textarea class="form-control" id="message-input" rows="4" placeholder="Enter your message here." required></textarea>
                                </div>

                                <div class="d-grid">
                                    <button type="submit" class="btn btn-outline-secondary">Submit</button>
                                </div>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>
    <footer>
        <span>Copyright © 2026 by Rina Taing.</span>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>

</body>
</html>
